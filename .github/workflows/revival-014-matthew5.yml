name: REVIVAL 014 — Greek Matthew 5 and WITNESS crosswalk

on:
  push:
    branches:
      - feature/revival-014-matthew5-sblgnt
  pull_request:
    paths:
      - 'src/revival/matthew5*.py'
      - 'sources/sblgnt-v1.2/**'
      - 'tests/test_matthew5.py'
      - '.github/workflows/revival-014-matthew5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install REVIVAL
        run: python -m pip install -e .
      - name: Check exact pinned source fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from revival.matthew5 import FIXTURE_BLOB,git_blob_sha1
          blob=Path("sources/sblgnt-v1.2/Matt.5.txt").read_bytes()
          assert git_blob_sha1(blob)==FIXTURE_BLOB
          print("SBLGNT pinned subset Git blob:", FIXTURE_BLOB)
          PY
      - name: Test Greek source identity and browser features
        run: python -m unittest discover -s tests -p 'test_matthew5.py' -v
      - name: Build standalone Greek + WITNESS reading game
        run: |
          python -m revival.matthew5_atlas \
            --root . \
            --output dist/revival-matthew5-witness.html \
            --pretty
          test -s dist/revival-matthew5-witness.html
          ! grep -q 'audio_base64":' dist/revival-matthew5-witness.html
      - name: Verify all existing REVIVAL tests still pass
        run: python -m unittest discover -s tests -v
      - name: Distribute offline Greek-WITNESS Atlas for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: revival-014-matthew5-witness
          path: dist/revival-matthew5-witness.html
          retention-days: 30
