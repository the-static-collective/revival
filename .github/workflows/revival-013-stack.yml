name: REVIVAL 013 Scripture Stack Expedition

on:
  push:
    branches:
      - integration/scripture-stack-expedition-013
  pull_request:
    paths:
      - 'src/revival/stack_expedition.py'
      - 'src/revival/stack_expedition_atlas.py'
      - 'tests/test_stack_expedition*.py'
      - '.github/workflows/revival-013-stack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install REVIVAL package
        run: python -m pip install -e .
      - name: Compile Python modules
        run: python -m compileall -q src/revival
      - name: Run REVIVAL 013 crossing tests
        run: python -m unittest discover -s tests -p 'test_stack_expedition*.py' -v
      - name: Build the playable two-file offline Atlas
        run: |
          python -m revival.stack_expedition_atlas \
            corpora/oshb-v2.2-genesis-opening.json \
            --macula-xml sources/macula-hebrew/Gen.1.1-lowfat.xml \
            --macula-manifest sources/macula-hebrew/source.json \
            --output dist/revival-stack-expedition.html \
            --pretty
          test -s dist/revival-stack-expedition.html
          test -s dist/revival-world-places.html
          ! grep -q 'audio_base64' dist/revival-stack-expedition.html
      - name: Full existing REVIVAL suite
        run: python -m unittest discover -s tests -v
