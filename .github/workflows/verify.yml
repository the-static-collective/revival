name: revival-proof

on:
  pull_request:
  push:
    branches: [main]

jobs:
  genesis-specimen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Replay Genesis 1:1
        run: python -m revival specimens/genesis-1-1.json --pretty > /tmp/genesis-1-1.receipt.json
      - name: Compile unpointed Genesis 1:1
        run: python -m revival specimens/genesis-1-1-linguistic.json --recipe unpointed --pretty > /tmp/genesis-1-1.unpointed.json
      - name: Compile reader-demo Genesis 1:1
        run: python -m revival specimens/genesis-1-1-linguistic.json --recipe reader-demo --pretty > /tmp/genesis-1-1.reader-demo.json
      - name: Inspect reader-demo choices
        run: python -m revival specimens/genesis-1-1-linguistic.json --recipe reader-demo --list-choices --pretty > /tmp/genesis-1-1.choices.json
      - name: Compile Elohim preference profile
        run: python -m revival specimens/genesis-1-1-linguistic.json --recipe reader-demo --profile profiles/genesis-1-1-elohim.json --pretty > /tmp/genesis-1-1.elohim.json
      - name: Open default Elohim token room
        run: python -m revival specimens/genesis-1-1-linguistic.json --recipe reader-demo --open-token g3 --pretty > /tmp/genesis-1-1.g3-room.json
      - name: Open preferred Elohim token room
        run: python -m revival specimens/genesis-1-1-linguistic.json --recipe reader-demo --profile profiles/genesis-1-1-elohim.json --open-token g3 --pretty > /tmp/genesis-1-1.g3-elohim-room.json
      - name: Traverse relation destination room
        run: python -m revival specimens/genesis-1-1-linguistic.json --recipe reader-demo --open-token g2 --pretty > /tmp/genesis-1-1.g2-room.json
      - name: Build default Curiosity Atlas
        run: python -m revival specimens/genesis-1-1-linguistic.json --recipe reader-demo --build-atlas /tmp/genesis-1-1.html --pretty > /tmp/genesis-1-1.atlas.json
      - name: Build Elohim Curiosity Atlas
        run: python -m revival specimens/genesis-1-1-linguistic.json --recipe reader-demo --profile profiles/genesis-1-1-elohim.json --build-atlas /tmp/genesis-1-1-elohim.html --pretty > /tmp/genesis-1-1-elohim.atlas.json
      - name: Verify standalone Atlas artifacts
        run: |
          test -s /tmp/genesis-1-1.html
          test -s /tmp/genesis-1-1-elohim.html
          grep -q "Curiosity Atlas" /tmp/genesis-1-1.html
          grep -q "revival-data" /tmp/genesis-1-1.html
      - name: Adapt pinned OSHB Genesis 1:1
        run: |
          python -m revival.adapters.oshb \
            sources/oshb-v2.2/Gen.1.1.xml \
            --manifest sources/oshb-v2.2/source.json \
            --output /tmp/oshb-genesis-1-1.json
      - name: Compile real OSHB source-backed verse
        run: python -m revival /tmp/oshb-genesis-1-1.json --recipe unpointed --pretty > /tmp/oshb-genesis-1-1.unpointed.json
      - name: Open real OSHB Elohim room
        run: python -m revival /tmp/oshb-genesis-1-1.json --recipe surface --open-token 01TyA --pretty > /tmp/oshb-genesis-1-1.01TyA.json
      - name: Build real-food Curiosity Atlas
        run: python -m revival /tmp/oshb-genesis-1-1.json --recipe surface --build-atlas /tmp/oshb-genesis-1-1.html --pretty > /tmp/oshb-genesis-1-1.atlas.json
      - name: Verify real linguistic record reached the world
        run: |
          test -s /tmp/oshb-genesis-1-1.html
          grep -q '"external_word_id": "01TyA"' /tmp/oshb-genesis-1-1.01TyA.json
          grep -q '"lemma": "430"' /tmp/oshb-genesis-1-1.01TyA.json
          grep -q '"morph": "HNcmpa"' /tmp/oshb-genesis-1-1.01TyA.json
          grep -q 'Declared layers' /tmp/oshb-genesis-1-1.html
          grep -q 'HNcmpa' /tmp/oshb-genesis-1-1.html
      - name: Index dangerous lemma 430 across Genesis opening corpus
        run: |
          python -m revival.corpus \
            corpora/oshb-v2.2-genesis-opening.json \
            --lemma 430 \
            --pretty > /tmp/revival-lemma-430.json
      - name: Verify exact lemma occurrence constellation
        run: |
          grep -q '"token_id": "01TyA"' /tmp/revival-lemma-430.json
          grep -q '"token_id": "01x9c"' /tmp/revival-lemma-430.json
          grep -q '"token_id": "01JM7"' /tmp/revival-lemma-430.json
      - name: Open Genesis 1:1 cross-passage lemma room
        run: |
          python -m revival.corpus \
            corpora/oshb-v2.2-genesis-opening.json \
            --locator Gen.1.1 \
            --token 01TyA \
            --pretty > /tmp/revival-genesis-1-1-lemma-room.json
      - name: Verify dangerous lemma doors
        run: |
          grep -q '"destination_locator": "Gen.1.2"' /tmp/revival-genesis-1-1-lemma-room.json
          grep -q '"destination_token_id": "01x9c"' /tmp/revival-genesis-1-1-lemma-room.json
          grep -q '"destination_locator": "Gen.1.3"' /tmp/revival-genesis-1-1-lemma-room.json
          grep -q '"destination_token_id": "01JM7"' /tmp/revival-genesis-1-1-lemma-room.json
      - name: Build multi-witness dangerous-lemma Atlas
        run: |
          python -m revival.corpus_atlas \
            corpora/oshb-v2.2-genesis-opening.json \
            --output /tmp/revival-genesis-opening.html \
            --pretty > /tmp/revival-genesis-opening.atlas.json
      - name: Verify cross-passage Atlas
        run: |
          test -s /tmp/revival-genesis-opening.html
          grep -q 'Dangerous Lemma Doors' /tmp/revival-genesis-opening.html
          grep -q 'Gen.1.2::01x9c' /tmp/revival-genesis-opening.html
          grep -q 'Gen.1.3::01JM7' /tmp/revival-genesis-opening.html
      - name: Build Aleph-Tav instrument data
        run: |
          python -m revival.aleph_tav \
            corpora/oshb-v2.2-genesis-opening.json \
            --pretty > /tmp/revival-aleph-tav.json
      - name: Verify earned 853 and c/853 family bridge
        run: |
          grep -q '"token_id": "01vuQ"' /tmp/revival-aleph-tav.json
          grep -q '"token_id": "01k5P"' /tmp/revival-aleph-tav.json
          grep -q '"declared_lemma": "853"' /tmp/revival-aleph-tav.json
          grep -q '"declared_lemma": "c/853"' /tmp/revival-aleph-tav.json
          grep -q '"particle_type": "direct object marker"' /tmp/revival-aleph-tav.json
      - name: Open prefixed Aleph-Tav room
        run: |
          python -m revival.aleph_tav \
            corpora/oshb-v2.2-genesis-opening.json \
            --locator Gen.1.1 \
            --token 01k5P \
            --pretty > /tmp/revival-aleph-tav-prefixed.json
      - name: Verify morpheme decomposition stays explicit
        run: |
          grep -q '"lemma": "c"' /tmp/revival-aleph-tav-prefixed.json
          grep -q '"lemma": "853"' /tmp/revival-aleph-tav-prefixed.json
          grep -q '"part_of_speech": "Conjunction"' /tmp/revival-aleph-tav-prefixed.json
          grep -q '"particle_type": "direct object marker"' /tmp/revival-aleph-tav-prefixed.json
      - name: Build walkable Aleph-Tav Atlas
        run: |
          python -m revival.aleph_tav_atlas \
            corpora/oshb-v2.2-genesis-opening.json \
            --output /tmp/revival-aleph-tav.html \
            --pretty > /tmp/revival-aleph-tav.atlas.json
      - name: Verify Aleph-Tav learning surface
        run: |
          test -s /tmp/revival-aleph-tav.html
          grep -q 'Aleph/Tav Instrument' /tmp/revival-aleph-tav.html
          grep -q 'direct object marker' /tmp/revival-aleph-tav.html
          grep -q 'OBJ→' /tmp/revival-aleph-tav.html
          grep -q 'not encoded here as the grammatical meaning' /tmp/revival-aleph-tav.html
      - name: Open first MACULA-backed object relation
        run: |
          python -m revival.object_relations \
            corpora/oshb-v2.2-genesis-opening.json \
            --macula-xml sources/macula-hebrew/Gen.1.1-lowfat.xml \
            --macula-manifest sources/macula-hebrew/source.json \
            --locator Gen.1.1 \
            --token 01vuQ \
            --pretty > /tmp/revival-object-first.json
      - name: Verify first actual object relation
        run: |
          grep -q '"oshb_token_id": "01Nvk"' /tmp/revival-object-first.json
          grep -q '"oshb_token_ids":' /tmp/revival-object-first.json
          grep -q '"01TSc"' /tmp/revival-object-first.json
          grep -q '"clause_rule": "PP-V-S-O"' /tmp/revival-object-first.json
          grep -q '"role": "A1"' /tmp/revival-object-first.json
      - name: Open prefixed MACULA-backed object relation
        run: |
          python -m revival.object_relations \
            corpora/oshb-v2.2-genesis-opening.json \
            --macula-xml sources/macula-hebrew/Gen.1.1-lowfat.xml \
            --macula-manifest sources/macula-hebrew/source.json \
            --locator Gen.1.1 \
            --token 01k5P \
            --pretty > /tmp/revival-object-second.json
      - name: Verify prefixed marker relation
        run: |
          grep -q '"oshb_component_index": 1' /tmp/revival-object-second.json
          grep -q '"01nPh"' /tmp/revival-object-second.json
          grep -q '"evidence_layer": "syntax tree"' /tmp/revival-object-second.json
          grep -q '"evidence_layer": "semantic frame"' /tmp/revival-object-second.json
      - name: Build object-relation Atlas
        run: |
          python -m revival.object_relations_atlas \
            corpora/oshb-v2.2-genesis-opening.json \
            --macula-xml sources/macula-hebrew/Gen.1.1-lowfat.xml \
            --macula-manifest sources/macula-hebrew/source.json \
            --output /tmp/revival-object-relations.html \
            --pretty > /tmp/revival-object-relations.atlas.json
      - name: Verify attributed relation surface
        run: |
          test -s /tmp/revival-object-relations.html
          grep -q 'Object Relations' /tmp/revival-object-relations.html
          grep -q 'From marker to actual attributed structure' /tmp/revival-object-relations.html
          grep -q 'Syntax tree' /tmp/revival-object-relations.html
          grep -q 'Semantic frame' /tmp/revival-object-relations.html
          grep -q 'PP-V-S-O' /tmp/revival-object-relations.html
          grep -q 'MACULA Hebrew Linguistic Datasets' /tmp/revival-object-relations.html
      - name: Build Revival first world
        run: |
          python -m revival.first_world \
            corpora/oshb-v2.2-genesis-opening.json \
            --macula-xml sources/macula-hebrew/Gen.1.1-lowfat.xml \
            --macula-manifest sources/macula-hebrew/source.json \
            --output /tmp/revival-first-world.html \
            --pretty > /tmp/revival-first-world.receipt.json
      - name: Verify unified world surface
        run: |
          test -s /tmp/revival-first-world.html
          grep -q 'Every object in this world knows where it came from.' /tmp/revival-first-world.html
          grep -q 'Fog is a feature.' /tmp/revival-first-world.html
          grep -q 'suppressed by the current projection' /tmp/revival-first-world.html
          grep -q '"world_kind": "revival-first-world"' /tmp/revival-first-world.receipt.json
