name: revival-proof

on:
  pull_request:
  push:
    branches: [main]

jobs:
  genesis-specimen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Replay Genesis 1:1
        run: python -m revival specimens/genesis-1-1.json --pretty > /tmp/genesis-1-1.receipt.json
