[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revival-scripture"
version = "0.1.0"
description = "A source-backed custom Bible compiler with replayable linguistic projections."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
revival = "revival.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
